[build]
  command = "pnpm install && pnpm build && cd hex && pnpm build && cd ../landing && pnpm build && cd ../demos && pnpm build && cd .. && pnpm story:build && node scripts/build-deploy.mjs"
  publish = "deploy"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.30.2"

# Redirect root to /hexrig/
[[redirects]]
  from = "/"
  to = "/hexrig/"
  status = 302

# SPA fallback for Histoire (uses client-side routing)
[[redirects]]
  from = "/hexrig/story/*"
  to = "/hexrig/story/index.html"
  status = 200

# SPA fallback for the demos app (gallery, the 13 example sites, the museum).
# Must come BEFORE the landing rule below — Netlify takes the first match, and
# `/hexrig/*` would otherwise serve the landing page's index.html for every
# demo deep link. The app is a single-page build with one index.html, so
# without this rule any direct hit or refresh on /hexrig/demos/<anything>
# lands on the wrong app entirely.
[[redirects]]
  from = "/hexrig/demos/*"
  to = "/hexrig/demos/index.html"
  status = 200

# SPA fallback for landing page
[[redirects]]
  from = "/hexrig/*"
  to = "/hexrig/index.html"
  status = 200

# Clean URLs for landing page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
